# config.yaml — Hugo configuration
# Too Good Togo !

baseURL: "https://toogoodtogo.blog/"
languageCode: "fr"
title: "Too Good Togo !"
theme: "hugo-paper"

# Taxonomies (FR-3)
taxonomies:
  author: authors
  tag: tags

# Menus
menu:
  main:
    - name: "Auteurs"
      url: "/authors/"
      weight: 10
    - name: "École"
      url: "/tags/ecole/"
      weight: 15
    - name: "Spi"
      url: "/tags/spi/"
      weight: 16
    - name: "Archives"
      url: "/archives/"
      weight: 20
    - name: "Newsletter"
      url: "/newsletter/"
      weight: 25
    - name: "À propos"
      url: "/a-propos/"
      weight: 30

# Paramètres du site
params:
  subtitle: ""
  # color removed — handled by CSS tokens (--color-bg in tokens.css)
  disableHLJS: true
  # Commentaires Cusdis (plan gratuit hébergé, https://cusdis.com)
  cusdisAppId: "f27144a9-8e54-435d-8c53-1744ffd3b604"

# Permaliens
permalinks:
  posts: "/:year/:month/:slug/"

# RSS natif (FR-10) — aucune config supplémentaire requise
# Hugo génère automatiquement /index.xml

# Markup
markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      typographer:
        disable: false
        leftDoubleQuote: "«&nbsp;"
        rightDoubleQuote: "&nbsp;»"
        leftSingleQuote: "‹&nbsp;"
        rightSingleQuote: "&nbsp;›"

# Build
buildDrafts: false
buildFuture: false
buildExpired: false

# Minification
minify:
  disableXML: true
  minifyOutput: false

# Pagination
pagination:
  pagerSize: 20

# Résumés
summaryLength: 70

# Copyright
copyright: "Famille — Sokodé, Togo"
